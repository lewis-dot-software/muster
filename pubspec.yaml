name: muster
description: Brings the real codebases a Dart or Flutter tool is tested against to the commits and versions it pins, resolved, inside its own dart test.
version: 0.0.0+0
repository: https://github.com/lewis-dot-software/muster
topics:
  - testing
  - git
  - pub
publish_to: none

environment:
  sdk: ^3.13.0
workspace:
  - example
dev_dependencies:
  analyzer: ^14.7.0
  grit:
    git:
      url: https://github.com/lewis-dot-software/grit
      ref: v0.3.4
  lints: ^6.1.0
  test: ^1.33.0
dependencies:
  args: ^2.7.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  path: ^1.9.1
  pub_semver: ^2.2.1
  yaml: ^3.1.4
