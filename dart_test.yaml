# Ten minutes, many times any test's passing run, so the Mac's load never
# fails a run that would pass, and a failing glados draw whose body awaits,
# as every property that runs git or a toolchain does, fails in place of
# shrinking for hours. A test's own timeout never fires under a package's
# `none`, so the bound sits here. No timer cuts a synchronous body's shrink,
# since it never returns to the event loop.
timeout: 10m
